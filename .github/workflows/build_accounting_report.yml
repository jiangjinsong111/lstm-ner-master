name: Build accounting report

on:
  push:
    branches:
      - tmp-word-report-20260803
    paths:
      - 'tmp_word_report/build_accounting_report.py'
      - '.github/workflows/build_accounting_report.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-word-report-20260803
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install python-docx matplotlib
      - name: Build Word file
        run: python tmp_word_report/build_accounting_report.py
      - name: Commit generated Word file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp_word_report/output
          git diff --cached --quiet || git commit -m 'Build revised accounting report'
          git push origin HEAD:tmp-word-report-20260803
