name: Build temporary Word report

on:
  push:
    branches:
      - tmp-word-report-20260803
    paths:
      - 'tmp_word_report/generate_report.py'
      - '.github/workflows/build-word-report.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tmp_word_report/generate_report.py'
      - '.github/workflows/build-word-report.yml'
      - 'tmp_word_report/*.docx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-word-report-20260803
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate document
        run: python tmp_word_report/generate_report.py
      - name: Upload Word artifact
        uses: actions/upload-artifact@v4
        with:
          name: revised-word-report
          path: tmp_word_report/合肥工业大学会计学专业培养方案对标调研分析报告_语言修订版.docx
      - name: Commit generated document
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp_word_report/*.docx tmp_word_report/figure1.png
          git diff --cached --quiet || git commit -m 'Generate revised Word report [skip ci]'
          git push
# synchronize pull request build
